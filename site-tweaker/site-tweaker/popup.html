<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Tweaker</title>
<style>
*{box-sizing:border-box}body{width:285px;margin:0;padding:18px;font:14px/1.45 system-ui,sans-serif;color:#182033;background:#fff}
h1{font-size:18px;margin:0 0 5px}p{color:#667085;margin:0 0 14px}
button:disabled{opacity:.5;cursor:default}
button{width:100%;border:0;border-radius:9px;padding:11px 12px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}
#status{font-size:12px;margin-top:10px;color:#667085;min-height:17px}
.small{font-size:11px;margin-top:12px;color:#7a8496}
</style></head>
<body>
<h1>Site Tweaker</h1>
<p>Visually edit this page, add elements, and keep your changes after reload.</p>
<button id="toggle">Enable visual editor</button>
<div id="status"></div>
<div class="small">Changes are saved in this Chrome profile. They do not modify the live website.</div>
<script src="popup.js"></script>
</body></html>
