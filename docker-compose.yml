# PhishGuard — full stack via Docker
#   frontend (Nuxt SPA)  -> http://localhost:3000
#   backend  (Laravel)   -> http://localhost:8000
#
#   docker compose up --build

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: phishguard-rabbitmq
    environment:
      # A non-'guest' user that can authenticate from remote agents (the built-in
      # 'guest' is restricted to localhost). Change RABBITMQ_PASS for production.
      RABBITMQ_DEFAULT_USER: "phishguard"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-phishguard_dev}"
    ports:
      - "5672:5672"     # AMQP — expose via a tunnel for remote campaign agents
      - "15672:15672"   # Management UI → http://localhost:15672 (phishguard / phishguard_dev)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  novnc:
    build:
      context: .
      dockerfile: novnc/Dockerfile
    container_name: phishguard-novnc
    ports:
      - "6080:6080"   # noVNC web UI  → http://localhost:6080
      - "9222:9222"   # Chrome DevTools Protocol (CDP)
    volumes:
      # Mount the Site Tweaker extension read-only inside Chrome
      - ./site-tweaker/site-tweaker:/extensions/site-tweaker:ro
    shm_size: 2gb     # Chrome needs shared memory
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: phishguard-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # Pinned so encrypted data (server passwords) survives container
      # recreation. Overridable via a host .env; never regenerated at boot.
      APP_KEY: "${APP_KEY:-base64:mv7fWURuffLx5YJAzeUmmGU+WqExkttJGGHRyiAr2hA=}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      QUEUE_CONNECTION: database
      # Keep above DeployCampaign::$timeout so a long deploy isn't re-queued.
      DB_QUEUE_RETRY_AFTER: "3700"
      # Default Git repo/branch the campaign servers clone (per-campaign override
      # in the UI wins). Set DEPLOY_REPO_URL to your pushed repo.
      DEPLOY_REPO_URL: "${DEPLOY_REPO_URL:-}"
      DEPLOY_BRANCH: "${DEPLOY_BRANCH:-master}"
      DEPLOY_NOVNC_PORT: "6080"
      # RabbitMQ the control plane publishes commands to / consumes events from.
      PHISHGUARD_AMQP_URL: "amqp://phishguard:${RABBITMQ_PASS:-phishguard_dev}@rabbitmq:5672/"
      # Public AMQP URL injected into remote campaign servers so their agents
      # can phone home. Set this to your tunnel (e.g. amqps://host:5671/).
      DEPLOY_AMQP_PUBLIC_URL: "${DEPLOY_AMQP_PUBLIC_URL:-}"
    depends_on:
      rabbitmq:
        condition: service_started
    volumes:
      # Persist the SQLite database across container restarts
      - backend-db:/app/database
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',8000)?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: http://localhost:8000
    container_name: phishguard-frontend
    ports:
      - "3000:3000"
    environment:
      # Browser reaches the API on the host-published port
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend

volumes:
  backend-db:
